name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  playwright-docker:
    name: Run Playwright (Docker Container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t playwright-tests .

      - name: Run Playwright Tests in Docker
        run: docker run --rm playwright-tests

      - name: Copy Playwright Test Results from Docker (Optional)
        if: always()
        run: |
          # Create a container to extract the test results if they exist
          docker create --name test-container playwright-tests
          docker cp test-container:/app/playwright-report ./playwright-report-docker || true
          docker cp test-container:/app/test-results ./test-results-docker || true
          docker rm test-container

      - name: Upload Docker Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-docker
          path: playwright-report-docker/
          retention-days: 30
