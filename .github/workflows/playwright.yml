name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Choose a Playwright project/browser to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      tag:
        description: 'Filter by Playwright test tag (e.g., @playwright, @docker. Leave blank for all)'
        required: false
        default: ''
        type: string

jobs:
  setup:
    name: Determine Target Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
    steps:
      - id: select
        run: |
          if [ "${{ github.event.inputs.project }}" = "all" ]; then
            echo "projects=[\"chromium\", \"firefox\", \"webkit\"]" >> $GITHUB_OUTPUT
          else
            echo "projects=[\"${{ github.event.inputs.project }}\"]" >> $GITHUB_OUTPUT
          fi

  playwright-docker:
    name: Run Playwright (Docker - ${{ matrix.project }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.setup.outputs.projects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-playwright-app .

      - name: Run Playwright Tests in Docker
        run: |
          mkdir -p playwright-report
          TAG_ARG=""
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG_ARG="--grep ${{ github.event.inputs.tag }}"
          fi
          docker run --rm \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            my-playwright-app \
            npx playwright test --project=${{ matrix.project }} $TAG_ARG

      - name: Upload Docker Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30